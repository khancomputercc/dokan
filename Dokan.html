            getCustomerSalesReport(customerId) {
                const sales = this.getSales();
                const customerSales = sales.filter(sale => sale.customer_id === customerId);
                
                const report = {
                    customer_id: customerId,
                    total_sales: customerSales.length,
                    total_amount: customerSales.reduce((sum, sale) => sum + sale.total_amount, 0),
                    total_paid: customerSales.reduce((sum, sale) => sum + (sale.advance_paid || 0), 0),
                    total_due: customerSales.reduce((sum, sale) => sum + (sale.due_amount || 0), 0),
                    cash_sales: customerSales.filter(sale => sale.payment_method === 'নগদ' || sale.payment_method === 'মোবাইল ব্যাংকিং' || sale.payment_method === 'কার্ড').reduce((sum, sale) => sum + sale.total_amount, 0),
                    credit_sales: customerSales.filter(sale => sale.payment_method === 'বাকি').reduce((sum, sale) => sum + sale.total_amount, 0),
                    sales_by_category: {},
                    sales_by_date: {},
                    recent_sales: customerSales.slice(-10).reverse()
                };
                
                // ক্যাটাগরি অনুযায়ী বিক্রয়
                customerSales.forEach(sale => {
                    sale.items.forEach(item => {
                        const category = this.getCategory(item.category_id);
                        if (category) {
                            if (!report.sales_by_category[category.name]) {
                                report.sales_by_category[category.name] = 0;
                            }
                            report.sales_by_category[category.name] += item.total;
                        }
                    });
                    
                    // তারিখ অনুযায়ী বিক্রয়
                    const date = sale.sale_date.split('T')[0];
                    if (!report.sales_by_date[date]) {
                        report.sales_by_date[date] = 0;
                    }
                    report.sales_by_date[date] += sale.total_amount;
                });
                
                return report;
            }
            
            // নতুন মেথড: সরবরাহকারী অনুযায়ী ক্রয় রিপোর্ট
            getSupplierPurchaseReport(supplierId) {
                const transactions = this.getTransactions();
                const supplierTransactions = this.getSupplierTransactions() || [];
                
                const supplierPurchases = transactions.filter(t => 
                    t.supplier_id === supplierId && t.type === 'in'
                );
                
                const supplierPayments = supplierTransactions.filter(t => 
                    t.supplier_id === supplierId && t.type === 'payment'
                );
                
                const report = {
                    supplier_id: supplierId,
                    total_purchases: supplierPurchases.length,
                    total_purchase_amount: supplierPurchases.reduce((sum, t) => sum + (t.quantity * t.price), 0),
                    total_payments: supplierPayments.reduce((sum, t) => sum + t.amount, 0),
                    current_due: supplierPurchases.reduce((sum, t) => sum + (t.quantity * t.price), 0) - 
                                supplierPayments.reduce((sum, t) => sum + t.amount, 0),
                    purchases_by_product: {},
                    purchases_by_date: {},
                    recent_purchases: supplierPurchases.slice(-10).reverse()
                };
                
                // পণ্য অনুযায়ী ক্রয়
                supplierPurchases.forEach(purchase => {
                    const product = this.getProduct(purchase.product_id);
                    if (product) {
                        if (!report.purchases_by_product[product.name]) {
                            report.purchases_by_product[product.name] = {
                                quantity: 0,
                                amount: 0
                            };
                        }
                        report.purchases_by_product[product.name].quantity += purchase.quantity;
                        report.purchases_by_product[product.name].amount += (purchase.quantity * purchase.price);
                    }
                    
                    // তারিখ অনুযায়ী ক্রয়
                    const date = purchase.timestamp.split('T')[0];
                    if (!report.purchases_by_date[date]) {
                        report.purchases_by_date[date] = 0;
                    }
                    report.purchases_by_date[date] += (purchase.quantity * purchase.price);
                });
                
                return report;
            }
            
            // নতুন মেথড: ক্যাটাগরি অনুযায়ী নগদ-বাকি রিপোর্ট
            getCategoryWiseCashCreditReport() {
                const sales = this.getSales();
                const products = this.getProducts();
                const categories = this.getCategories();
                
                const report = {
                    categories: {},
                    total_cash: 0,
                    total_credit: 0,
                    total_sales: 0
                };
                
                // প্রতিটি ক্যাটাগরির জন্য ইনিশিয়ালাইজ
                categories.forEach(category => {
                    report.categories[category.name] = {
                        cash: 0,
                        credit: 0,
                        total: 0,
                        percentage: 0
                    };
                });
                
                // বিক্রয় ডেটা প্রসেস
                sales.forEach(sale => {
                    const isCashSale = sale.payment_method === 'নগদ' || 
                                      sale.payment_method === 'মোবাইল ব্যাংকিং' || 
                                      sale.payment_method === 'কার্ড';
                    
                    sale.items.forEach(item => {
                        const product = products.find(p => p.id === item.product_id);
                        if (product) {
                            const category = categories.find(c => c.id === product.category_id);
                            if (category && report.categories[category.name]) {
                                if (isCashSale) {
                                    report.categories[category.name].cash += item.total;
                                    report.total_cash += item.total;
                                } else {
                                    report.categories[category.name].credit += item.total;
                                    report.total_credit += item.total;
                                }
                                report.categories[category.name].total += item.total;
                                report.total_sales += item.total;
                            }
                        }
                    });
                });
                
                // শতাংশ ক্যালকুলেট
                Object.keys(report.categories).forEach(categoryName => {
                    if (report.total_sales > 0) {
                        report.categories[categoryName].percentage = 
                            (report.categories[categoryName].total / report.total_sales) * 100;
                    }
                });
                
                return report;
            }
            
            // নতুন মেথড: নির্মাণ সামগ্রী নগদ-বাকি সামারি
            getConstructionMaterialsSummary() {
                const constructionCategories = ['রড/লোহা', 'সিমেন্ট', 'মোটাবালু', 'ইট'];
                const report = this.getCategoryWiseCashCreditReport();
                
                const constructionSummary = {
                    total_cash: 0,
                    total_credit: 0,
                    total_sales: 0,
                    categories: {}
                };
                
                constructionCategories.forEach(categoryName => {
                    if (report.categories[categoryName]) {
                        constructionSummary.categories[categoryName] = report.categories[categoryName];
                        constructionSummary.total_cash += report.categories[categoryName].cash;
                        constructionSummary.total_credit += report.categories[categoryName].credit;
                        constructionSummary.total_sales += report.categories[categoryName].total;
                    }
                });
                
                return constructionSummary;
            }
            
            // নতুন মেথড: সরবরাহকারী লেনদেন
            getSupplierTransactions() {
                return JSON.parse(localStorage.getItem('supplier_transactions') || '[]');
            }
            
            addSupplierTransaction(transaction) {
                const transactions = this.getSupplierTransactions();
                transaction.id = transactions.length > 0 ? Math.max(...transactions.map(t => t.id)) + 1 : 1;
                transactions.push(transaction);
                localStorage.setItem('supplier_transactions', JSON.stringify(transactions));
                return transaction;
            }
            
            updateSupplierTransaction(id, updatedTransaction) {
                const transactions = this.getSupplierTransactions();
                const index = transactions.findIndex(t => t.id === id);
                if (index !== -1) {
                    transactions[index] = { ...transactions[index], ...updatedTransaction };
                    localStorage.setItem('supplier_transactions', JSON.stringify(transactions));
                    return transactions[index];
                }
                return null;
            }
            
            deleteSupplierTransaction(id) {
                const transactions = this.getSupplierTransactions();
                const filtered = transactions.filter(t => t.id !== id);
                localStorage.setItem('supplier_transactions', JSON.stringify(filtered));
                return true;
            }
            
            // গ্রাহকের নগদ-বাকি আপডেট
            updateCustomerCashCredit(customerId, saleAmount, paymentMethod) {
                const customer = this.getCustomer(customerId);
                if (!customer) return null;
                
                const isCash = paymentMethod === 'নগদ' || 
                              paymentMethod === 'মোবাইল ব্যাংকিং' || 
                              paymentMethod === 'কার্ড';
                
                if (isCash) {
                    customer.total_cash = (customer.total_cash || 0) + saleAmount;
                } else {
                    customer.total_credit = (customer.total_credit || 0) + saleAmount;
                }
                
                return this.updateCustomer(customerId, customer);
            }
            
            // পূর্বের সকল মেথডগুলি এখানে থাকবে...
            // ... (পূর্বের সকল ডেটাবেস মেথডগুলি)

        }

                            </div>
                        </div>

                    <!-- সরবরাহকারী বিস্তারিত রিপোর্ট মোডাল -->
                    <div class="modal fade" id="supplierDetailsModal" tabindex="-1">
                        <div class="modal-dialog modal-xl">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title" id="supplierDetailsModalTitle">সরবরাহকারী বিস্তারিত রিপোর্ট</h5>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body" id="supplierDetailsContent">
                                    <!-- সরবরাহকারী রিপোর্ট এখানে লোড হবে -->
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- সরবরাহকারী পেমেন্ট মোডাল -->
                    <div class="modal fade" id="supplierPaymentModal" tabindex="-1">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">সরবরাহকারী পেমেন্ট রেকর্ড</h5>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">

                                            <div class="col-md-6 mb-3">

                                                <select class="form-control" id="paymentSupplier" required>
                                                    <option value="">নির্বাচন করুন</option>
                                                    ${suppliers.map(s => 
                                                        `<option value="${s.id}">${s.name} (বাকি: ${s.balance} টাকা)</option>`
                                                    ).join('')}
                                                </select>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label for="paymentType" class="form-label">ধরন *</label>
                                                <select class="form-control" id="paymentType" required>
                                                    <option value="payment">পেমেন্ট</option>
                                                    <option value="purchase">ক্রয়</option>

                                            <div class="col-md-6 mb-3">
                                                <label for="paymentMethod" class="form-label">পেমেন্ট পদ্ধতি *</label>
                                                <select class="form-control" id="paymentMethod" required>
                                                    <option value="নগদ">নগদ</option>
                                                    <option value="ব্যাংক">ব্যাংক</option>
                                                    <option value="মোবাইল ব্যাংকিং">মোবাইল ব্যাংকিং</option>
                                                    <option value="চেক">চেক</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <label for="paymentNotes" class="form-label">মন্তব্য</label>
                                            <textarea class="form-control" id="paymentNotes" rows="3"></textarea>

                                    <hr class="my-4">
                                    
                                    <h5>সরবরাহকারী পেমেন্ট তালিকা</h5>
                                    <div class="table-responsive">
                                        <table class="table table-hover">
                                            <thead>
                                                <tr>
                                                    <th>তারিখ</th>
                                                    <th>সরবরাহকারী</th>
                                                    <th>ধরন</th>
                                                    <th>পরিমাণ</th>
                                                    <th>পদ্ধতি</th>
                                                    <th>মন্তব্য</th>
                                                    <th>কার্যক্রম</th>
                                                </tr>
                                            </thead>
                                            <tbody id="supplierPaymentList">
                                                ${this.db.getSupplierTransactions().map(transaction => {
                                                    const supplier = this.db.getSupplier(transaction.supplier_id);
                                                    return `
                                                        <tr>
                                                            <td>${new Date(transaction.date).toLocaleDateString()}</td>
                                                            <td>${supplier ? supplier.name : 'Unknown'}</td>
                                                            <td>
                                                                <span class="badge ${transaction.type === 'payment' ? 'bg-success' : 'bg-info'}">
                                                                    ${transaction.type === 'payment' ? 'পেমেন্ট' : 'ক্রয়'}
                                                                </span>
                                                            </td>
                                                            <td>${transaction.amount.toFixed(2)} টাকা</td>
                                                            <td>${transaction.payment_method}</td>
                                                            <td><small>${transaction.notes || '-'}</small></td>
                                                            <td>
                                                                ${this.currentUser.role === 'admin' ? `
                                                                <button class="btn btn-sm btn-danger delete-supplier-payment" data-id="${transaction.id}">
                                                                    <i class="fas fa-trash"></i>
                                                                </button>
                                                                ` : ''}
                                                            </td>
                                                        </tr>

                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                        </div>
                    </div>
                `;
            }
            
            // ... (পূর্বের সকল রেন্ডার মেথডগুলি)

            // নতুন ইভেন্ট লিসেনার সেটআপ
            setupDashboardEventListeners() {
                // পূর্বের সকল ইভেন্ট লিসেনার এখানে থাকবে...
                
                // গ্রাহক/সরবরাহকারী রিপোর্ট ট্যাব
                if (document.getElementById('customer-tab')) {
                    // ট্যাব ইভেন্ট
                    const reportTabs = document.querySelectorAll('#reportTabs button');
                    reportTabs.forEach(tab => {
                        tab.addEventListener('shown.bs.tab', (event) => {
                            if (event.target.id === 'comparison-tab') {
                                this.initializeComparisonCharts();
                            }
                        });
                    });
                    
                    // গ্রাহক ফিল্টার
                    const filterCustomerReport = document.getElementById('filterCustomerReport');
                    if (filterCustomerReport) {
                        filterCustomerReport.addEventListener('click', () => this.filterCustomerReport());
                    }
                    
                    // সরবরাহকারী ফিল্টার
                    const filterSupplierReport = document.getElementById('filterSupplierReport');
                    if (filterSupplierReport) {
                        filterSupplierReport.addEventListener('click', () => this.filterSupplierReport());
                    }
                    
                    // গ্রাহক বিস্তারিত রিপোর্ট
                    document.querySelectorAll('.view-customer-details').forEach(button => {
                        button.addEventListener('click', (e) => {
                            const customerId = parseInt(e.target.closest('.view-customer-details').getAttribute('data-id'));
                            this.viewCustomerDetails(customerId);
                        });
                    });
                    
                    // সরবরাহকারী বিস্তারিত রিপোর্ট
                    document.querySelectorAll('.view-supplier-details').forEach(button => {
                        button.addEventListener('click', (e) => {
                            const supplierId = parseInt(e.target.closest('.view-supplier-details').getAttribute('data-id'));
                            this.viewSupplierDetails(supplierId);
                        });
                    });
                    
                    // সরবরাহকারী পেমেন্ট ফর্ম
                    const supplierPaymentForm = document.getElementById('supplierPaymentForm');
                    if (supplierPaymentForm) {
                        supplierPaymentForm.addEventListener('submit', (e) => {
                            e.preventDefault();
                            this.handleSupplierPaymentSubmit();
                        });
                    }
                }
            }
            
            // নতুন মেথড: গ্রাহক রিপোর্ট ফিল্টার
            filterCustomerReport() {
                const searchTerm = document.getElementById('customerSearch')?.value.toLowerCase() || '';
                const typeFilter = document.getElementById('customerTypeFilter')?.value || '';
                const customers = this.db.getCustomers();
                
                const filteredCustomers = customers.filter(customer => {
                    const matchesSearch = customer.name.toLowerCase().includes(searchTerm) ||
                                         customer.phone.includes(searchTerm) ||
                                         customer.customer_id.toLowerCase().includes(searchTerm);
                    const matchesType = !typeFilter || customer.type === typeFilter;
                    
                    return matchesSearch && matchesType;
                });
                
                const tableBody = document.getElementById('customerReportTable');
                if (tableBody) {
                    tableBody.innerHTML = filteredCustomers.map(customer => {
                        const report = this.db.getCustomerSalesReport(customer.id);
                        const customerTypeBadge = customer.type === 'ভিআইপি' ? 
                            'bg-danger' : customer.type === 'নিয়মিত' ? 
                            'bg-success' : 'bg-secondary';
                        
                        return `
                            <tr>
                                <td>
                                    <strong>${customer.name}</strong><br>
                                    <small class="text-muted">${customer.phone}</small>
                                </td>
                                <td>
                                    <span class="badge ${customerTypeBadge}">
                                        ${customer.type}
                                    </span>
                                </td>
                                <td>${report.total_amount.toFixed(2)} টাকা</td>
                                <td>${report.cash_sales.toFixed(2)} টাকা</td>
                                <td>${report.credit_sales.toFixed(2)} টাকা</td>
                                <td>
                                    <span class="badge bg-info">
                                        ${customer.total_advance.toFixed(2)} টাকা
                                    </span>
                                </td>
                                <td>
                                    <span class="badge ${report.total_due > 0 ? 'bg-warning' : 'bg-success'}">
                                        ${report.total_due.toFixed(2)} টাকা
                                    </span>
                                </td>
                                <td>${customer.last_purchase ? new Date(customer.last_purchase).toLocaleDateString() : 'N/A'}</td>
                                <td>
                                    <button class="btn btn-sm btn-info view-customer-details" data-id="${customer.id}">
                                        <i class="fas fa-chart-bar"></i> রিপোর্ট
                                    </button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                }
            }
            
            // নতুন মেথড: সরবরাহকারী রিপোর্ট ফিল্টার
            filterSupplierReport() {
                const searchTerm = document.getElementById('supplierSearch')?.value.toLowerCase() || '';
                const suppliers = this.db.getSuppliers();
                
                const filteredSuppliers = suppliers.filter(supplier => {
                    return supplier.name.toLowerCase().includes(searchTerm) ||
                           (supplier.contact_person && supplier.contact_person.toLowerCase().includes(searchTerm)) ||
                           supplier.phone.includes(searchTerm) ||
                           supplier.supplier_id.toLowerCase().includes(searchTerm);
                });
                
                const tableBody = document.getElementById('supplierReportTable');
                if (tableBody) {
                    tableBody.innerHTML = filteredSuppliers.map(supplier => {
                        const report = this.db.getSupplierPurchaseReport(supplier.id);
                        const dueStatus = supplier.balance > 0 ? 'bg-warning' : 'bg-success';
                        
                        return `
                            <tr>
                                <td>
                                    <strong>${supplier.name}</strong><br>
                                    <small class="text-muted">${supplier.supplier_id}</small>
                                </td>
                                <td>
                                    <small>${supplier.contact_person || 'N/A'}<br>
                                    ${supplier.phone}</small>
                                </td>
                                <td>${report.total_purchase_amount.toFixed(2)} টাকা</td>
                                <td>${report.total_payments.toFixed(2)} টাকা</td>
                                <td>
                                    <span class="badge ${dueStatus}">
                                        ${report.current_due.toFixed(2)} টাকা
                                    </span>
                                </td>
                                <td>${supplier.products_supplied ? supplier.products_supplied.length : 0}</td>
                                <td>${supplier.last_supply ? new Date(supplier.last_supply).toLocaleDateString() : 'N/A'}</td>
                                <td>
                                    <button class="btn btn-sm btn-info view-supplier-details" data-id="${supplier.id}">
                                        <i class="fas fa-chart-bar"></i> রিপোর্ট
                                    </button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                }
            }
            
            // নতুন মেথড: গ্রাহক বিস্তারিত রিপোর্ট দেখান
            viewCustomerDetails(customerId) {
                const customer = this.db.getCustomer(customerId);
                if (!customer) return;
                
                const report = this.db.getCustomerSalesReport(customerId);
                
                // ক্যাটাগরি চার্ট ডেটা
                const categoryLabels = Object.keys(report.sales_by_category);
                const categoryValues = Object.values(report.sales_by_category);
                
                // তারিখ অনুযায়ী ডেটা
                const dateLabels = Object.keys(report.sales_by_date).slice(-7); // শেষ 7 দিন
                const dateValues = Object.values(report.sales_by_date).slice(-7);
                
                const content = `
                    <div>
                        <div class="row mb-4">
                            <div class="col-md-8">
                                <h4>${customer.name} - বিস্তারিত রিপোর্ট</h4>
                                <p class="mb-1"><strong>ফোন:</strong> ${customer.phone}</p>
                                <p class="mb-1"><strong>ধরন:</strong> <span class="badge ${customer.type === 'ভিআইপি' ? 'bg-danger' : customer.type === 'নিয়মিত' ? 'bg-success' : 'bg-secondary'}">${customer.type}</span></p>
                                <p class="mb-1"><strong>ঠিকানা:</strong> ${customer.address || 'N/A'}</p>
                            </div>
                            <div class="col-md-4 text-end">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <h5 class="card-title">সারাংশ</h5>
                                        <p class="mb-1">মোট ক্রয়: <strong>${report.total_amount.toFixed(2)} টাকা</strong></p>
                                        <p class="mb-1">নগদ: <span class="text-success">${report.cash_sales.toFixed(2)} টাকা</span></p>
                                        <p class="mb-1">বাকি: <span class="text-warning">${report.credit_sales.toFixed(2)} টাকা</span></p>
                                        <p class="mb-1">জমা: <span class="text-info">${customer.total_advance.toFixed(2)} টাকা</span></p>
                                        <p class="mb-0">বর্তমান বাকি: <span class="text-danger">${report.total_due.toFixed(2)} টাকা</span></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h6 class="card-title mb-0">ক্যাটাগরি অনুযায়ী ক্রয়</h6>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="customerCategoryChart" height="200"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h6 class="card-title mb-0">সাম্প্রতিক ক্রয় ট্রেন্ড</h6>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="customerTrendChart" height="200"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="card">
                            <div class="card-header">
                                <h6 class="card-title mb-0">সাম্প্রতিক ক্রয় তালিকা</h6>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>ইনভয়েস</th>
                                                <th>তারিখ</th>
                                                <th>মোট</th>
                                                <th>জমা</th>
                                                <th>বাকি</th>
                                                <th>পেমেন্ট পদ্ধতি</th>
                                                <th>বিবরণ</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${report.recent_sales.map(sale => `
                                                <tr>
                                                    <td><strong>${sale.invoice_no}</strong></td>
                                                    <td>${new Date(sale.sale_date).toLocaleDateString()}</td>
                                                    <td>${sale.total_amount.toFixed(2)} টাকা</td>
                                                    <td>${sale.advance_paid ? sale.advance_paid.toFixed(2) + ' টাকা' : '০.০০ টাকা'}</td>
                                                    <td>
                                                        <span class="badge ${sale.due_amount > 0 ? 'bg-warning' : 'bg-success'}">
                                                            ${sale.due_amount ? sale.due_amount.toFixed(2) + ' টাকা' : '০.০০ টাকা'}
                                                        </span>
                                                    </td>
                                                    <td>${sale.payment_method}</td>
                                                    <td>
                                                        <button class="btn btn-sm btn-info view-sale" data-id="${sale.id}">
                                                            <i class="fas fa-eye"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                document.getElementById('customerDetailsContent').innerHTML = content;
                document.getElementById('customerDetailsModalTitle').textContent = `${customer.name} - বিস্তারিত রিপোর্ট`;
                const modal = new bootstrap.Modal(document.getElementById('customerDetailsModal'));
                modal.show();
                
                // চার্ট ইনিশিয়ালাইজ
                setTimeout(() => {
                    this.initializeCustomerCharts(categoryLabels, categoryValues, dateLabels, dateValues);
                }, 100);
            }
            
            // নতুন মেথড: সরবরাহকারী বিস্তারিত রিপোর্ট দেখান
            viewSupplierDetails(supplierId) {
                const supplier = this.db.getSupplier(supplierId);
                if (!supplier) return;
                
                const report = this.db.getSupplierPurchaseReport(supplierId);
                
                // পণ্য অনুযায়ী ডেটা
                const productLabels = Object.keys(report.purchases_by_product);
                const productQuantities = Object.values(report.purchases_by_product).map(p => p.quantity);
                const productAmounts = Object.values(report.purchases_by_product).map(p => p.amount);
                
                const content = `
                    <div>
                        <div class="row mb-4">
                            <div class="col-md-8">
                                <h4>${supplier.name} - বিস্তারিত রিপোর্ট</h4>
                                <p class="mb-1"><strong>সরবরাহকারী আইডি:</strong> ${supplier.supplier_id}</p>
                                <p class="mb-1"><strong>যোগাযোগ:</strong> ${supplier.contact_person || 'N/A'} (${supplier.phone})</p>
                                <p class="mb-1"><strong>ইমেইল:</strong> ${supplier.email || 'N/A'}</p>
                                <p class="mb-1"><strong>ঠিকানা:</strong> ${supplier.address || 'N/A'}</p>
                            </div>
                            <div class="col-md-4 text-end">
                                <div class="card bg-light">
                                    <div class="card-body">
                                        <h5 class="card-title">সারাংশ</h5>
                                        <p class="mb-1">মোট ক্রয়: <strong>${report.total_purchase_amount.toFixed(2)} টাকা</strong></p>
                                        <p class="mb-1">মোট পরিশোধ: <span class="text-success">${report.total_payments.toFixed(2)} টাকা</span></p>
                                        <p class="mb-1">বর্তমান বাকি: <span class="text-warning">${report.current_due.toFixed(2)} টাকা</span></p>
                                        <p class="mb-1">মোট লেনদেন: ${report.total_purchases}</p>
                                        <p class="mb-0">সরবরাহকৃত পণ্য: ${supplier.products_supplied ? supplier.products_supplied.length : 0}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h6 class="card-title mb-0">পণ্য অনুযায়ী ক্রয় (পরিমাণ)</h6>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="supplierProductQuantityChart" height="200"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h6 class="card-title mb-0">পণ্য অনুযায়ী ক্রয় (মূল্য)</h6>
                                    </div>
                                    <div class="card-body">
                                        <canvas id="supplierProductValueChart" height="200"></canvas>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="card">
                            <div class="card-header">
                                <h6 class="card-title mb-0">সাম্প্রতিক ক্রয় তালিকা</h6>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>তারিখ</th>
                                                <th>পণ্য</th>
                                                <th>পরিমাণ</th>
                                                <th>দাম</th>
                                                <th>মোট</th>
                                                <th>মন্তব্য</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${report.recent_purchases.map(purchase => {
                                                const product = this.db.getProduct(purchase.product_id);
                                                return `
                                                    <tr>
                                                        <td>${new Date(purchase.timestamp).toLocaleDateString()}</td>
                                                        <td>${product ? product.name : 'Unknown'}</td>
                                                        <td>${purchase.quantity}</td>
                                                        <td>${purchase.price.toFixed(2)} টাকা</td>
                                                        <td>${(purchase.quantity * purchase.price).toFixed(2)} টাকা</td>
                                                        <td><small>${purchase.notes || '-'}</small></td>
                                                    </tr>
                                                `;
                                            }).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                        
                        <div class="card mt-4">
                            <div class="card-header">
                                <h6 class="card-title mb-0">পেমেন্ট রেকর্ড</h6>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>তারিখ</th>
                                                <th>ধরন</th>
                                                <th>পরিমাণ</th>
                                                <th>পদ্ধতি</th>
                                                <th>মন্তব্য</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${this.db.getSupplierTransactions()
                                                .filter(t => t.supplier_id === supplierId)
                                                .map(transaction => `
                                                    <tr>
                                                        <td>${new Date(transaction.date).toLocaleDateString()}</td>
                                                        <td>
                                                            <span class="badge ${transaction.type === 'payment' ? 'bg-success' : 'bg-info'}">
                                                                ${transaction.type === 'payment' ? 'পেমেন্ট' : 'ক্রয়'}
                                                            </span>
                                                        </td>
                                                        <td>${transaction.amount.toFixed(2)} টাকা</td>
                                                        <td>${transaction.payment_method}</td>
                                                        <td><small>${transaction.notes || '-'}</small></td>
                                                    </tr>
                                                `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                document.getElementById('supplierDetailsContent').innerHTML = content;
                document.getElementById('supplierDetailsModalTitle').textContent = `${supplier.name} - বিস্তারিত রিপোর্ট`;
                const modal = new bootstrap.Modal(document.getElementById('supplierDetailsModal'));
                modal.show();
                
                // চার্ট ইনিশিয়ালাইজ
                setTimeout(() => {
                    this.initializeSupplierCharts(productLabels, productQuantities, productAmounts);
                }, 100);
            }
            
            // নতুন মেথড: সরবরাহকারী পেমেন্ট সাবমিট
            handleSupplierPaymentSubmit() {
                const supplierId = parseInt(document.getElementById('paymentSupplier').value);
                const type = document.getElementById('paymentType').value;
                const amount = parseFloat(document.getElementById('paymentAmount').value);
                const paymentMethod = document.getElementById('paymentMethod').value;
                const notes = document.getElementById('paymentNotes').value;
                const date = document.getElementById('paymentDate').value;
                
                if (!supplierId || !amount || amount <= 0) {
                    this.showAlert('দয়া করে সঠিক তথ্য প্রদান করুন', 'warning');
                    return;
                }
                
                const supplier = this.db.getSupplier(supplierId);
                if (!supplier) {
                    this.showAlert('সরবরাহকারী খুঁজে পাওয়া যায়নি', 'danger');
                    return;
                }
                
                const transaction = {
                    supplier_id: supplierId,
                    type: type,
                    amount: amount,
                    payment_method: paymentMethod,
                    notes: notes,
                    date: date || new Date().toISOString(),
                    created_by: this.currentUser.id
                };
                
                this.db.addSupplierTransaction(transaction);
                
                // সরবরাহকারীর ব্যালেন্স আপডেট
                if (type === 'payment') {
                    supplier.balance = Math.max(0, (supplier.balance || 0) - amount);
                    supplier.total_paid = (supplier.total_paid || 0) + amount;
                } else {
                    supplier.balance = (supplier.balance || 0) + amount;
                    supplier.total_purchase = (supplier.total_purchase || 0) + amount;
                }
                
                this.db.updateSupplier(supplierId, supplier);
                
                const modal = bootstrap.Modal.getInstance(document.getElementById('supplierPaymentModal'));
                modal.hide();
                
                this.showAlert(`${type === 'payment' ? 'পেমেন্ট' : 'ক্রয়'} রেকর্ড করা হয়েছে`, 'success');
                
                // রিফ্রেশ
                if (this.currentView === 'customer-supplier-report') {
                    this.navigateTo('customer-supplier-report');
                }
            }
            
            // নতুন মেথড: তুলনামূলক চার্ট ইনিশিয়ালাইজ
            initializeComparisonCharts() {
                const customers = this.db.getCustomers();
                const suppliers = this.db.getSuppliers();
                
                // শীর্ষ ৫ গ্রাহক
                const topCustomers = customers
                    .sort((a, b) => b.total_purchases - a.total_purchases)
                    .slice(0, 5);
                
                const customerLabels = topCustomers.map(c => c.name);
                const customerData = topCustomers.map(c => c.total_purchases);
                
                // শীর্ষ ৫ সরবরাহকারী
                const topSuppliers = suppliers
                    .sort((a, b) => b.total_purchase - a.total_purchase)
                    .slice(0, 5);
                
                const supplierLabels = topSuppliers.map(s => s.name);
                const supplierData = topSuppliers.map(s => s.total_purchase);
                
                // গ্রাহক চার্ট
                const customerCtx = document.getElementById('topCustomersChart');
                if (customerCtx) {
                    new Chart(customerCtx, {
                        type: 'bar',
                        data: {
                            labels: customerLabels,
                            datasets: [{
                                label: 'মোট ক্রয় (টাকা)',
                                data: customerData,
                                backgroundColor: 'rgba(54, 162, 235, 0.7)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    display: false
                                },
                                title: {
                                    display: true,
                                    text: 'শীর্ষ ৫ গ্রাহক'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return value.toLocaleString() + ' টাকা';
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
                
                // সরবরাহকারী চার্ট
                const supplierCtx = document.getElementById('topSuppliersChart');
                if (supplierCtx) {
                    new Chart(supplierCtx, {
                        type: 'bar',
                        data: {
                            labels: supplierLabels,
                            datasets: [{
                                label: 'মোট ক্রয় (টাকা)',
                                data: supplierData,
                                backgroundColor: 'rgba(75, 192, 192, 0.7)',
                                borderColor: 'rgba(75, 192, 192, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    display: false
                                },
                                title: {
                                    display: true,
                                    text: 'শীর্ষ ৫ সরবরাহকারী'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return value.toLocaleString() + ' টাকা';
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }
            
            // নতুন মেথড: গ্রাহক চার্ট ইনিশিয়ালাইজ
            initializeCustomerCharts(categoryLabels, categoryValues, dateLabels, dateValues) {
                // ক্যাটাগরি চার্ট
                const categoryCtx = document.getElementById('customerCategoryChart');
                if (categoryCtx) {
                    new Chart(categoryCtx, {
                        type: 'pie',
                        data: {
                            labels: categoryLabels,
                            datasets: [{
                                data: categoryValues,
                                backgroundColor: [
                                    '#FF6384',
                                    '#36A2EB',
                                    '#FFCE56',
                                    '#4BC0C0',
                                    '#9966FF',
                                    '#FF9F40'
                                ]
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'bottom'
                                },
                                title: {
                                    display: true,
                                    text: 'ক্যাটাগরি অনুযায়ী ক্রয়'
                                }
                            }
                        }
                    });
                }
                
                // ট্রেন্ড চার্ট
                const trendCtx = document.getElementById('customerTrendChart');
                if (trendCtx) {
                    new Chart(trendCtx, {
                        type: 'line',
                        data: {
                            labels: dateLabels,
                            datasets: [{
                                label: 'ক্রয় (টাকা)',
                                data: dateValues,
                                borderColor: '#36A2EB',
                                backgroundColor: 'rgba(54, 162, 235, 0.1)',
                                borderWidth: 2,
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    display: false
                                },
                                title: {
                                    display: true,
                                    text: 'সাম্প্রতিক ক্রয় ট্রেন্ড'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return value.toLocaleString() + ' টাকা';
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }
            
            // নতুন মেথড: সরবরাহকারী চার্ট ইনিশিয়ালাইজ
            initializeSupplierCharts(productLabels, productQuantities, productAmounts) {
                // পরিমাণ চার্ট
                const quantityCtx = document.getElementById('supplierProductQuantityChart');
                if (quantityCtx) {
                    new Chart(quantityCtx, {
                        type: 'bar',
                        data: {
                            labels: productLabels,
                            datasets: [{
                                label: 'পরিমাণ',
                                data: productQuantities,
                                backgroundColor: 'rgba(255, 99, 132, 0.7)',
                                borderColor: 'rgba(255, 99, 132, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    display: false
                                },
                                title: {
                                    display: true,
                                    text: 'পণ্য অনুযায়ী পরিমাণ'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                }
                
                // মূল্য চার্ট
                const valueCtx = document.getElementById('supplierProductValueChart');
                if (valueCtx) {
                    new Chart(valueCtx, {
                        type: 'bar',
                        data: {
                            labels: productLabels,
                            datasets: [{
                                label: 'মূল্য (টাকা)',
                                data: productAmounts,
                                backgroundColor: 'rgba(75, 192, 192, 0.7)',
                                borderColor: 'rgba(75, 192, 192, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    display: false
                                },
                                title: {
                                    display: true,
                                    text: 'পণ্য অনুযায়ী মূল্য'
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return value.toLocaleString() + ' টাকা';
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }
            
            // ... (পূর্বের সকল মেথডগুলি)

        }

        // অ্যাপ্লিকেশন শুরু করুন
        document.addEventListener('DOMContentLoaded', () => {
            new App();
        });
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
