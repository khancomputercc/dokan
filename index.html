                        const customers = this.db.getCustomers();
                        reportHtml = `
                            <h4>গ্রাহক প্রতিবেদন</h4>
                            <div class="row mt-4">
                                <div class="col-md-4"><div class="card"><div class="card-body"><h5 class="card-title">মোট গ্রাহক</h5><h2 class="text-primary">${customers.length}</h2><p class="text-muted mb-0">গ্রাহক সংখ্যা</p></div></div></div>
                                <div class="col-md-4"><div class="card"><div class="card-body"><h5 class="card-title">মোট জমা</h5><h2 class="text-success">${customers.reduce((sum, c) => sum + (c.total_advance || 0), 0).toFixed(2)} টাকা</h2><p class="text-muted mb-0">গ্রাহকদের জমা</p></div></div></div>
                                <div class="col-md-4"><div class="card"><div class="card-body"><h5 class="card-title">মোট ক্রয়</h5><h2 class="text-info">${customers.reduce((sum, c) => sum + (c.total_purchases || 0), 0).toFixed(2)} টাকা</h2><p class="text-muted mb-0">সব গ্রাহকের ক্রয়</p></div></div></div>
                            </div>
                            <div class="mt-4"><h5>শীর্ষ ১০ গ্রাহক</h5><table class="table table-bordered"><thead><tr><th>গ্রাহক</th><th>ধরন</th><th>মোট ক্রয়</th><th>মোট জমা</th><th>শেষ ক্রয়</th></tr></thead><tbody>${customers.sort((a, b) => b.total_purchases - a.total_purchases).slice(0, 10).map(customer => { const report = this.db.getCustomerSalesReport(customer.id); return `<tr><td>${customer.name}</td><td><span class="badge ${customer.type === 'ভিআইপি' ? 'bg-danger' : customer.type === 'নিয়মিত' ? 'bg-success' : 'bg-secondary'}">${customer.type}</span></td><td>${report.total_amount.toFixed(2)} টাকা</td><td>${customer.total_advance.toFixed(2)} টাকা</td><td>${customer.last_purchase ? new Date(customer.last_purchase).toLocaleDateString('bn-BD') : 'কোনো ক্রয় নেই'}</td></tr>`; }).join('')}</tbody></table></div>
                        `;
                        break;
                        
                    case 'supplier':
                        const suppliers = this.db.getSuppliers();
                        reportHtml = `
                            <h4>সরবরাহকারী প্রতিবেদন</h4>
                            <div class="row mt-4">
                                <div class="col-md-4"><div class="card"><div class="card-body"><h5 class="card-title">মোট সরবরাহকারী</h5><h2 class="text-primary">${suppliers.length}</h2><p class="text-muted mb-0">সরবরাহকারী সংখ্যা</p></div></div></div>
                                <div class="col-md-4"><div class="card"><div class="card-body"><h5 class="card-title">মোট লেনদেন</h5><h2 class="text-success">${suppliers.reduce((sum, s) => sum + (s.total_transactions || 0), 0)}</h2><p class="text-muted mb-0">লেনদেন সংখ্যা</p></div></div></div>
                                <div class="col-md-4"><div class="card"><div class="card-body"><h5 class="card-title">মোট বাকি</h5><h2 class="text-warning">${suppliers.reduce((sum, s) => sum + (s.balance || 0), 0).toFixed(2)} টাকা</h2><p class="text-muted mb-0">সরবরাহকারীদের বাকি</p></div></div></div>
                            </div>
                            <div class="mt-4"><h5>সরবরাহকারী তালিকা</h5><table class="table table-bordered"><thead><tr><th>সরবরাহকারী</th><th>যোগাযোগ</th><th>পণ্য সংখ্যা</th><th>লেনদেন</th><th>বাকি</th><th>শেষ সরবরাহ</th></tr></thead><tbody>${suppliers.map(supplier => `<tr><td>${supplier.name}</td><td>${supplier.contact_person || '-'}<br>${supplier.phone}</td><td>${supplier.products_supplied ? supplier.products_supplied.length : 0}</td><td>${supplier.total_transactions || 0}</td><td>${supplier.balance ? supplier.balance.toFixed(2) + ' টাকা' : '০.০০ টাকা'}</td><td>${supplier.last_supply ? new Date(supplier.last_supply).toLocaleDateString('bn-BD') : 'N/A'}</td></tr>`).join('')}</tbody></table></div>
                        `;
                        break;
                }
                
                document.getElementById('reportDisplay').innerHTML = reportHtml;
                this.showAlert('প্রতিবেদন তৈরি করা হয়েছে', 'success');
            }
            
            downloadReport() {
                const reportType = document.getElementById('reportType').value;
                const dateFrom = document.getElementById('reportDateFrom').value;
                const dateTo = document.getElementById('reportDateTo').value;
                
                let reportData = {};
                let filename = '';
                
                switch(reportType) {
                    case 'sales':
                        reportData = this.db.getSalesReport(dateFrom, dateTo);
                        filename = `sales-report-${dateFrom}-to-${dateTo}.json`;
                        break;
                    case 'stock':
                        reportData = { products: this.db.getProducts(), reportDate: new Date().toISOString() };
                        filename = `stock-report-${new Date().toISOString().split('T')[0]}.json`;
                        break;
                    case 'customer':
                        reportData = { customers: this.db.getCustomers(), reportDate: new Date().toISOString() };
                        filename = `customer-report-${new Date().toISOString().split('T')[0]}.json`;
                        break;
                    case 'supplier':
                        reportData = { suppliers: this.db.getSuppliers(), reportDate: new Date().toISOString() };
                        filename = `supplier-report-${new Date().toISOString().split('T')[0]}.json`;
                        break;
                }
                
                const dataStr = JSON.stringify(reportData, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', filename);
                linkElement.click();
                
                this.showAlert('রিপোর্ট ডাউনলোড করা হয়েছে', 'success');
            }
            
            updateStoreInfo() {
                const storeLogo = document.getElementById('storeLogo').value;
                const storeName = document.getElementById('storeName').value;
                const storeAddress = document.getElementById('storeAddress').value;
                const storePhone = document.getElementById('storePhone').value;
                const sellerName = document.getElementById('sellerName').value;
                
                localStorage.setItem('storeLogo', storeLogo);
                localStorage.setItem('storeName', storeName);
                localStorage.setItem('storeAddress', storeAddress);
                localStorage.setItem('storePhone', storePhone);
                localStorage.setItem('sellerName', sellerName);
                
                this.showAlert('দোকানের তথ্য আপডেট করা হয়েছে', 'success');
                
                setTimeout(() => {
                    location.reload();
                }, 1500);
            }
            
            toggleDarkMode(enable) {
                if (enable) {
                    document.body.classList.add('dark-mode');
                    localStorage.setItem('darkMode', 'enabled');
                } else {
                    document.body.classList.remove('dark-mode');
                    localStorage.setItem('darkMode', 'disabled');
                }
                this.showAlert(enable ? 'ডার্ক মোড সক্রিয় করা হয়েছে' : 'লাইট মোড সক্রিয় করা হয়েছে', 'success');
            }
            
            setGlobalAlertPercentage(percentage) {
                localStorage.setItem('globalAlertPercentage', percentage);
                this.showAlert('গ্লোবাল অ্যালার্ট লিমিট আপডেট করা হয়েছে!', 'success');
            }
            
            backupDatabase() {
                const backupData = this.db.backupDatabase();
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(backupData);
                const exportFileDefaultName = `stock-backup-${new Date().toISOString().split('T')[0]}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                
                this.showAlert('ডাটাবেস ব্যাকআপ ডাউনলোড করা হয়েছে', 'success');
            }
            
            restoreDatabase() {
                const fileInput = document.getElementById('restoreFile');
                if (!fileInput.files.length) {
                    this.showAlert('দয়া করে একটি ফাইল নির্বাচন করুন', 'warning');
                    return;
                }
                
                const file = fileInput.files[0];
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    try {
                        const success = this.db.restoreDatabase(e.target.result);
                        if (success) {
                            this.showAlert('ডাটাবেস রিস্টোর করা হয়েছে', 'success');
                            this.navigateTo('dashboard');
                        } else {
                            this.showAlert('রিস্টোর ব্যর্থ হয়েছে। ফাইল ফরম্যাট সঠিক নয়', 'danger');
                        }
                    } catch (error) {
                        this.showAlert('রিস্টোর ব্যর্থ হয়েছে: ' + error.message, 'danger');
                    }
                };
                
                reader.readAsText(file);
            }
            
            clearSalesData() {
                this.showConfirmation('আপনি কি নিশ্চিত যে আপনি সব বিক্রয় ডেটা মুছতে চান?', () => {
                    localStorage.removeItem('sales');
                    this.db.initDatabase();
                    this.showAlert('সব বিক্রয় ডেটা মুছে ফেলা হয়েছে', 'success');
                    this.navigateTo('dashboard');
                });
            }
            
            clearProductsData() {
                this.showConfirmation('আপনি কি নিশ্চিত যে আপনি সব পণ্য ডেটা মুছতে চান?', () => {
                    localStorage.removeItem('products');
                    localStorage.removeItem('transactions');
                    this.db.initDatabase();
                    this.showAlert('সব পণ্য ডেটা মুছে ফেলা হয়েছে', 'success');
                    this.navigateTo('dashboard');
                });
            }
            
            clearAllData() {
                this.showConfirmation('আপনি কি নিশ্চিত যে আপনি সব ডেটা মুছতে চান?', () => {
                    this.db.clearAllData();
                    this.showAlert('সব ডেটা মুছে ফেলা হয়েছে', 'success');
                    this.currentUser = null;
                    this.currentView = 'login';
                    this.render();
                });
            }
            
            showAlert(message, type = 'info') {
                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type} alert-dismissible fade show position-fixed`;
                alertDiv.style.cssText = 'top: 20px; right: 20px; z-index: 9999; max-width: 400px;';
                alertDiv.innerHTML = `${message}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
                
                document.body.appendChild(alertDiv);
                
                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.remove();
                    }
                }, 5000);
            }
            
            initializeStockChart() {
                const ctx = document.getElementById('stockChart');
                if (!ctx) return;
                
                if (window.stockChart) {
                    window.stockChart.destroy();
                }
                
                const products = this.db.getProducts();
                const stockStatus = { পর্যাপ্ত: 0, নিম্ন: 0, শেষ: 0 };
                
                products.forEach(product => {
                    if (product.quantity === 0) {
                        stockStatus.শেষ++;
                    } else if (this.db.isLowStock(product)) {
                        stockStatus.নিম্ন++;
                    } else {
                        stockStatus.পর্যাপ্ত++;
                    }
                });
                
                window.stockChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['পর্যাপ্ত স্টক', 'নিম্ন স্টক', 'স্টক শেষ'],
                        datasets: [{
                            data: [stockStatus.পর্যাপ্ত, stockStatus.নিম্ন, stockStatus.শেষ],
                            backgroundColor: ['#27ae60', '#f39c12', '#e74c3c'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { position: 'bottom', labels: { padding: 20 } } }
                    }
                });
            }
            
            formatInteger(value) {
                return Math.floor(value).toString();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new App();
        });
    </script>
    <script>
        function fixProductPrices() {
            const products = JSON.parse(localStorage.getItem('products') || '[]');
            let updated = false;
            
            products.forEach(p => {
                if (p.name.includes('রড') && p.price === 150) {
                    p.purchase_price = 95;
                    updated = true;
                } else if (!p.purchase_price) {
                    p.purchase_price = Math.round(p.price * 0.8 * 100) / 100;
                    updated = true;
                }
            });
            
            if (updated) {
                localStorage.setItem('products', JSON.stringify(products));
                console.log('✅ পণ্যের ক্রয় মূল্য আপডেট করা হয়েছে');
            }
        }

        const originalCalculate = App.prototype.calculateSalesSummary;
        App.prototype.calculateSalesSummary = function(sales) {
            let totalCash = 0, totalCredit = 0, totalProfit = 0;
            
            sales.forEach(sale => {
                const isCash = sale.payment_method === 'নগদ' || 
                              sale.payment_method === 'মোবাইল ব্যাংকিং' || 
                              sale.payment_method === 'কার্ড';
                
                if (isCash) totalCash += sale.total_amount;
                else totalCredit += sale.total_amount;
                
                if (sale.items) {
                    sale.items.forEach(item => {
                        const product = this.db.getProduct(item.product_id);
                        if (product && product.purchase_price) {
                            totalProfit += (item.price - product.purchase_price) * item.quantity;
                        } else {
                            totalProfit += item.total * 0.20;
                        }
                    });
                }
            });
            
            return { totalCash, totalCredit, totalProfit };
        };

        document.addEventListener('DOMContentLoaded', function() {
            fixProductPrices();
            
            setTimeout(() => {
                if (document.getElementById('totalProfit')) {
                    const app = window.app || (window.app = new App());
                    app.updateSalesSummary();
                }
            }, 1000);
        });

        const style = document.createElement('style');
        style.textContent = `#totalProfit { font-weight: bold; color: #27ae60; } .profit-badge { background: #27ae60; color: white; padding: 2px 8px; border-radius: 12px; }`;
        document.head.appendChild(style);

        console.log('✅ প্রফিট ক্যালকুলেশন ফিক্স করা হয়েছে');
    </script>

    <button id="scrollToTopBtn" class="scroll-to-top-btn" title="উপরে যান"><i class="fas fa-arrow-up"></i></button>
    <style>
        .scroll-to-top-btn {
            position: fixed; bottom: 30px; right: 30px; width: 50px; height: 50px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none;
            cursor: pointer; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease; z-index: 9999; display: none; animation: pulse 2s infinite;
        }
        .scroll-to-top-btn:hover { transform: translateY(-5px); box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @media (max-width: 768px) { .scroll-to-top-btn { width: 40px; height: 40px; font-size: 20px; bottom: 20px; right: 20px; } }
    </style>
    <script>
        (function() {
            const scrollBtn = document.getElementById('scrollToTopBtn');
            if (!scrollBtn) return;
            function checkScrollPosition() {
                const scrollY = window.scrollY || document.documentElement.scrollTop;
                scrollBtn.style.display = scrollY > 300 ? 'block' : 'none';
            }
            window.addEventListener('scroll', checkScrollPosition);
            checkScrollPosition();
            scrollBtn.addEventListener('click', function(e) {
                e.preventDefault();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            document.addEventListener('keydown', function(e) {
                if (e.shiftKey && e.key === 'Home') {
                    e.preventDefault();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
            console.log('✅ Scroll to Top Button initialized');
        })();
    </script>

    <button id="progressScrollBtn" class="progress-scroll-btn" title="উপরে যান">
        <svg class="progress-ring" width="60" height="60"><circle class="progress-ring__circle" stroke="#764ba2" stroke-width="4" fill="transparent" r="26" cx="30" cy="30"/></svg>
        <i class="fas fa-arrow-up progress-icon"></i>
    </button>
    <style>
        .progress-scroll-btn {
            position: fixed; bottom: 100px; right: 30px; width: 60px; height: 60px; border-radius: 50%;
            background: white; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 9998; display: none; transition: all 0.3s ease;
        }
        .progress-scroll-btn:hover { transform: scale(1.1); box-shadow: 0 6px 15px rgba(0,0,0,0.3); }
        .progress-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: #764ba2; z-index: 1; }
        .progress-ring { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
        .progress-ring__circle { transition: stroke-dashoffset 0.3s; stroke-dasharray: 163.36; stroke-dashoffset: 163.36; }
        @media (max-width: 768px) { .progress-scroll-btn { width: 50px; height: 50px; bottom: 90px; right: 20px; } .progress-icon { font-size: 20px; } }
    </style>
    <script>
        (function() {
            const progressBtn = document.getElementById('progressScrollBtn');
            if (!progressBtn) return;
            const circle = document.querySelector('.progress-ring__circle');
            const radius = circle.r.baseVal.value;
            const circumference = 2 * Math.PI * radius;
            circle.style.strokeDasharray = `${circumference}`;
            circle.style.strokeDashoffset = circumference;
            function setProgress(percent) {
                const offset = circumference - (percent / 100) * circumference;
                circle.style.strokeDashoffset = offset;
            }
            function checkProgress() {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                setProgress(scrolled);
                progressBtn.style.display = winScroll > 300 ? 'block' : 'none';
            }
            window.addEventListener('scroll', checkProgress);
            window.addEventListener('resize', checkProgress);
            checkProgress();
            progressBtn.addEventListener('click', function() { window.scrollTo({ top: 0, behavior: 'smooth' }); });
            console.log('✅ Progress Scroll Button initialized');
        })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
